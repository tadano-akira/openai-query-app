[project]
name = "openai-query-app-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.4",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "openai==3.29.0",
    "langfuse==4.17.0",
    "httpx",
    "argon2-cffi==25.1.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI の Depends() は既定値で使うのが標準/ E501: 行長は formatter に任せる
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
