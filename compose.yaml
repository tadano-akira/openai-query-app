# アプリ一式（開発用）: PostgreSQL / FastAPI / Vite
# Langfuse は langfuse/compose.yaml の別プロジェクト
name: oqa-app

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # pgvector 拡張入りの PostgreSQL 17（公式 postgres:17 と同じ Debian 13 trixie。照合順序が変わらない）
    image: docker.io/pgvector/pgvector:0.8.6-pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: app
      TZ: UTC
      PGTZ: UTC
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 10
    logging: *logging

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # 起動待ちはしない（未起動の間の送信は secret_scan_unavailable で止まる）
      presidio:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD:?}@db:5432/app
      # Windows のバインドマウントは inotify が届かないためポーリングで検知
      WATCHFILES_FORCE_POLLING: "true"
    command: >
      sh -c "uv sync --locked --no-install-project &&
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --workers 1"
    ports:
      - 127.0.0.1:8000:8000
    volumes:
      - ./backend:/app
      - backend_venv:/opt/venv
      - pdf_data:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *logging

  # 資料Q&A のバックグラウンドワーカー（PDF 解析）。backend が依存の同期とマイグレーションを終えてから起動する
  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD:?}@db:5432/app
    command: python -m app.worker
    volumes:
      - ./backend:/app
      - backend_venv:/opt/venv
      - pdf_data:/data
    # 解析は 1 並列。大きな PDF でホスト全体を圧迫しないよう上限を設ける
    mem_limit: 1536m
    logging: *logging

  # 送信前の機密情報検知（Microsoft Presidio Analyzer）。ホストへは公開せず backend からのみ使う
  presidio:
    image: mcr.microsoft.com/presidio-analyzer:2.2.362
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging

  frontend:
    image: node:24-slim
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    environment:
      API_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - 127.0.0.1:5173:5173
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    logging: *logging

volumes:
  db_data:
  # 原本 PDF と抽出成果物（バックアップ対象）
  pdf_data:
  backend_venv:
  frontend_node_modules:
